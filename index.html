<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>블랙 클리커</title>
    <style>
        /* 다크 테마 및 모바일 최적화 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            text-align: center; 
            background-color: #0f0f0f; 
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* 스크롤 방지 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .screen { 
            display: none; 
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            background: #1a1a1a; 
            padding: 20px; 
            box-sizing: border-box;
            position: relative;
        }
        
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 캐릭터 이미지 설정 */
        #character { 
            width: 220px; 
            height: 220px; 
            cursor: pointer; 
            transition: transform 0.05s; 
            object-fit: contain;
            -webkit-tap-highlight-color: transparent;
        }
        
        #character:active { transform: scale(0.9); }
        
        /* 버튼 및 입력창 */
        input { padding: 15px; font-size: 18px; width: 80%; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; background: #4a69bd; color: white; cursor: pointer; margin: 5px; }
        button:disabled { background: #444; color: #888; }

        .side-buttons { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; }
        #score-display { font-size: 28px; font-weight: bold; margin: 20px 0; }

        /* 부스터 게이지 */
        #gauge-box { width: 100%; height: 12px; background: #333; border-radius: 6px; margin: 10px 0; overflow: hidden; }
        #gauge-bar { width: 0%; height: 100%; background: linear-gradient(to right, #ff4757, #ffa502); transition: width 0.2s; }

        /* 랭킹/상점 리스트 */
        ul { width: 100%; padding: 0; list-style: none; overflow-y: auto; max-height: 60vh; }
        li { background: #252525; margin-bottom: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }

        .floating-text { position: absolute; font-size: 26px; font-weight: bold; color: #2ed573; animation: fadeUp 0.8s ease-out forwards; pointer-events: none; }
        @keyframes fadeUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <h1>블랙 클리커</h1>
        <input type="text" id="username" maxlength="10" placeholder="이름 입력 (10자 내)">
        <button onclick="startGame()">게임 시작</button>
        <p id="login-msg" style="color: #ff6b6b;"></p>
    </div>

    <div id="game-screen" class="screen">
        <div class="side-buttons">
            <button onclick="showScreen('ranking-screen')">🏆 랭킹</button>
            <button onclick="showScreen('shop-screen')">🛒 상점</button>
        </div>
        <div id="score-display">점수: <span id="score">0</span></div>
        
        <img id="character" src="default.png" alt="캐릭터" onclick="clickChar(event)">
        
        <div id="gauge-box"><div id="gauge-bar"></div></div>
        <button id="booster-btn" onclick="useBooster()" disabled>🚀 부스터 준비 중</button>
        <button onclick="resetGame()" style="background:#eb4d4b; margin-top:20px; font-size:12px;">데이터 초기화</button>
    </div>

    <div id="shop-screen" class="screen">
        <h2>상점</h2>
        <p>내 점수: <span id="shop-score">0</span></p>
        <ul>
            <li>
                <div><strong>야채호빵 (클릭강화)</strong><br><small>클릭 점수 +1 (최대 5개)</small></div>
                <button id="buy-helper" onclick="buyHelper()">50P</button>
            </li>
            <li>
                <div><strong>자동 클릭 알바</strong><br><small>1초마다 자동 점수</small></div>
                <button onclick="buyAuto()">150P</button>
            </li>
            <li>
                <div><strong>부스터 강화</strong><br><small>부스터 배수 증가</small></div>
                <button onclick="buyBoost()">100P</button>
            </li>
        </ul>
        <button onclick="showScreen('game-screen')">뒤로가기</button>
    </div>

    <div id="ranking-screen" class="screen">
        <h2>실시간 랭킹 (Top 50)</h2>
        <ul id="rank-list"></ul>
        <button onclick="showScreen('game-screen')">뒤로가기</button>
    </div>

<script>
    // 이미지 파일명 설정 (깃허브에 올린 파일명과 똑같아야 합니다!)
    const IMG_DEFAULT = "default.png"; // 기본 이미지 (호빵)
    const IMG_CLICK = "click.png";     // 클릭 시 이미지 (인형)
    const IMG_HELPER = "helper.png";   // 도우미 이미지

    let state = JSON.parse(localStorage.getItem('black_clicker_v3')) || {
        name: "", score: 0, power: 0, auto: 0, bPower: 0, gauge: 0
    };

    let isBooster = false;

    function save() { localStorage.setItem('black_clicker_v3', JSON.stringify(state)); }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id==='ranking-screen') renderRank();
        updateUI();
    }

    function startGame() {
        const n = document.getElementById('username').value.trim();
        if(!n || n.length > 10) return alert("이름을 확인해주세요.");
        state.name = n;
        save();
        showScreen('game-screen');
        startLoop();
    }

    function clickChar(e) {
        const char = document.getElementById('character');
        char.src = IMG_CLICK;
        setTimeout(() => char.src = IMG_DEFAULT, 100);

        let gain = (Math.floor(Math.random()*3)+1 + state.power) * (isBooster ? (2 + state.bPower*0.5) : 1);
        state.score += gain;
        
        if(!isBooster) {
            state.gauge = Math.min(100, state.gauge + 2);
        }
        
        showEffect(e, `+${Math.floor(gain)}`);
        updateUI();
        save();
    }

    function showEffect(e, txt) {
        const t = document.createElement('div');
        t.className = 'floating-text';
        t.innerText = txt;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        t.style.left = `${x - 20}px`;
        t.style.top = `${y - 40}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 800);
    }

    function updateUI() {
        document.getElementById('score').innerText = Math.floor(state.score);
        document.getElementById('shop-score').innerText = Math.floor(state.score);
        document.getElementById('gauge-bar').style.width = state.gauge + "%";
        const bBtn = document.getElementById('booster-btn');
        bBtn.disabled = state.gauge < 100 || isBooster;
        bBtn.innerText = isBooster ? "🔥 부스터 가동 중!!" : (state.gauge >= 100 ? "🚀 부스터 사용 가능!" : "🚀 부스터 충전 중");
        
        document.getElementById('buy-helper').innerText = state.power >= 5 ? "품절" : "50P";
        document.getElementById('buy-helper').disabled = state.power >= 5;
    }

    function useBooster() {
        isBooster = true;
        state.gauge = 100;
        updateUI();
        let dur = 10;
        const inv = setInterval(() => {
            dur--;
            state.gauge = (dur / 10) * 100;
            updateUI();
            if(dur <= 0) {
                clearInterval(inv);
                isBooster = false;
                state.gauge = 0;
                updateUI();
            }
        }, 1000);
    }

    function buyHelper() {
        if(state.score >= 50 && state.power < 5) {
            state.score -= 50; state.power++; save(); updateUI();
        }
    }

    function buyAuto() {
        if(state.score >= 150) {
            state.score -= 150; state.auto++; save(); updateUI();
        }
    }

    function buyBoost() {
        if(state.score >= 100) {
            state.score -= 100; state.bPower++; save(); updateUI();
        }
    }

    function startLoop() {
        setInterval(() => {
            if(state.auto > 0) {
                state.score += state.auto * (isBooster ? 2 : 1);
                updateUI();
                save();
            }
        }, 1000);
    }

    function resetGame() {
        if(confirm("모든 데이터를 초기화할까요?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function renderRank() {
        const list = document.getElementById('rank-list');
        list.innerHTML = "";
        let players = Array.from({length:49}, (_, i) => ({name:`유저${i+1}`, score: Math.random()*5000, online: Math.random()>0.5}));
        players.push({name: state.name, score: state.score, online: true});
        players.sort((a,b) => b.score - a.score);
        players.forEach((p, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${i+1}. <span style="color:${p.online?'#2ed573':'#555'}">●</span> ${p.name}</span> <b>${Math.floor(p.score)}</b>`;
            if(p.name === state.name) li.style.border = "1px solid #4a69bd";
            list.appendChild(li);
        });
    }

    if(state.name) { showScreen('game-screen'); startLoop(); }
</script>
</body>
</html>
